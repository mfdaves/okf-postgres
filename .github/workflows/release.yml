name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact release tag, for example v0.1.0"
        required: true
        type: string
      dist_tag:
        description: "npm distribution tag"
        required: true
        type: choice
        options:
          - next
          - latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # The smoke gate drives this producer through the okf-mcp producer host,
      # so the release needs the same sibling layout the CI workflow uses.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          path: okf-postgres

      - uses: actions/checkout@v6
        with:
          repository: mfdaves/okf-mcp
          path: okf-mcp

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: |
            okf-postgres/package-lock.json
            okf-mcp/package-lock.json

      - run: npm install --global "npm@^11.5.1"
      - run: npm --version

      - run: npm ci
        working-directory: okf-mcp

      - run: npm ci
        working-directory: okf-postgres
      - run: npm test
        working-directory: okf-postgres
      - run: npm run smoke
        working-directory: okf-postgres
      - run: npm run pack:check
        working-directory: okf-postgres

      - name: Verify release identity and publish
        shell: bash
        working-directory: okf-postgres
        env:
          NPM_DIST_TAG: ${{ inputs.dist_tag }}
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          NAME="$(node -p 'require("./package.json").name')"
          VERSION="$(node -p 'require("./package.json").version')"
          if [[ "${NAME}" != "@mfdaves/okf-postgres" ]]; then
            echo "Unexpected npm package identity: ${NAME}." >&2
            exit 1
          fi
          if [[ "${RELEASE_REF}" != "v${VERSION}" ]]; then
            echo "Release ref ${RELEASE_REF} does not match package version ${VERSION}." >&2
            exit 1
          fi
          if [[ "${NPM_DIST_TAG}" == "next" && "${VERSION}" != *-* ]]; then
            echo "The next tag requires a prerelease version." >&2
            exit 1
          fi
          if [[ "${NPM_DIST_TAG}" == "latest" && "${VERSION}" == *-* ]]; then
            echo "The latest tag cannot publish a prerelease version." >&2
            exit 1
          fi
          npm publish --access public --provenance --tag "${NPM_DIST_TAG}"
